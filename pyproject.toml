[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "envy-integrity-monitor"
version = "0.1.0"
description = "ENVY Integrity Monitor: encrypted file-integrity baselines with change detection, in a native app window"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "cryptography>=42,<47",
  "PyQt6>=6.7,<7",
]

[project.scripts]
envy-integrity-monitor = "envy_integrity_monitor.cli:main"

[project.gui-scripts]
envy-integrity-monitor-gui = "envy_integrity_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["envy_integrity_monitor*"]
